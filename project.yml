name: Omni
options:
  bundleIdPrefix: com.george.omni
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  OmniKit:
    path: OmniKit
targets:
  Omni:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Omni.entitlements
    dependencies:
      - package: OmniKit
        product: OmniCore
      - package: OmniKit
        product: OmniPlatform
      - package: OmniKit
        product: FeatureDiagnostics
      - package: OmniKit
        product: FeaturePalette
      - package: OmniKit
        product: FeatureClipboard
      - package: OmniKit
        product: FeatureWindows
      - package: OmniKit
        product: FeatureSwitcher
      - package: OmniKit
        product: FeatureKeepAwake
      - package: OmniKit
        product: FeatureKeyboardClean
      - package: OmniKit
        product: FeatureSystemStats
      - package: OmniKit
        product: FeatureShortcutOverlay
      - package: OmniKit
        product: FeatureTextActions
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Omni
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:
          - CFBundleURLName: com.george.omni
            CFBundleURLSchemes: [omni]
        NSMicrophoneUsageDescription: "Omni uses the microphone only while you record the screen with microphone audio turned on."
    entitlements:
      path: App/Omni.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Omni
        PRODUCT_BUNDLE_IDENTIFIER: com.george.omni
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Omni:
    build:
      targets:
        Omni: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: OmniKit/OmniCoreTests
        - package: OmniKit/OmniPlatformTests
        - package: OmniKit/FeaturePaletteTests
        - package: OmniKit/FeatureClipboardTests
        - package: OmniKit/FeatureWindowsTests
        - package: OmniKit/FeatureSwitcherTests
        - package: OmniKit/FeatureKeepAwakeTests
        - package: OmniKit/FeatureKeyboardCleanTests
        - package: OmniKit/FeatureSystemStatsTests
        - package: OmniKit/FeatureShortcutOverlayTests
        - package: OmniKit/FeatureTextActionsTests
    archive:
      config: Release

name: Tolio
options:
  bundleIdPrefix: com.george.tolio
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  OmniKit:
    path: OmniKit
targets:
  Tolio:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Tolio.entitlements
    dependencies:
      - target: TolioFinderNote
      - package: OmniKit
        product: OmniCore
      - package: OmniKit
        product: OmniPlatform
      - package: OmniKit
        product: FeatureDiagnostics
      - package: OmniKit
        product: FeaturePalette
      - package: OmniKit
        product: FeatureClipboard
      - package: OmniKit
        product: FeatureWindows
      - package: OmniKit
        product: FeatureSwitcher
      - package: OmniKit
        product: FeatureKeepAwake
      - package: OmniKit
        product: FeatureKeyboardClean
      - package: OmniKit
        product: FeatureSystemStats
      - package: OmniKit
        product: FeatureShortcutOverlay
      - package: OmniKit
        product: FeatureTextActions
      - package: OmniKit
        product: FeatureScreenshots
      - package: OmniKit
        product: FeatureStickyNotes
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tolio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:
          - CFBundleURLName: com.george.tolio
            CFBundleURLSchemes: [tolio]
        NSMicrophoneUsageDescription: "Tolio uses the microphone only while you record the screen with microphone audio turned on."
    entitlements:
      path: App/Tolio.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Tolio
        PRODUCT_BUNDLE_IDENTIFIER: com.george.tolio
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
  TolioFinderNote:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/FinderNote
        excludes:
          - Info.plist
          - FinderNote.entitlements
    dependencies:
      - package: OmniKit
        product: OmniCore
    info:
      path: Extensions/FinderNote/Info.plist
      properties:
        CFBundleDisplayName: Tolio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FinderSync"
          NSExtensionAttributes: {}
    entitlements:
      path: Extensions/FinderNote/FinderNote.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: TolioFinderNote
        PRODUCT_BUNDLE_IDENTIFIER: com.george.tolio.FinderNote
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
schemes:
  Tolio:
    build:
      targets:
        Tolio: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: OmniKit/OmniCoreTests
        - package: OmniKit/OmniPlatformTests
        - package: OmniKit/FeaturePaletteTests
        - package: OmniKit/FeatureClipboardTests
        - package: OmniKit/FeatureWindowsTests
        - package: OmniKit/FeatureSwitcherTests
        - package: OmniKit/FeatureKeepAwakeTests
        - package: OmniKit/FeatureKeyboardCleanTests
        - package: OmniKit/FeatureSystemStatsTests
        - package: OmniKit/FeatureShortcutOverlayTests
        - package: OmniKit/FeatureTextActionsTests
        - package: OmniKit/FeatureScreenshotsTests
        - package: OmniKit/FeatureStickyNotesTests
    archive:
      config: Release

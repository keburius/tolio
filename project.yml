name: AllSet
options:
  bundleIdPrefix: com.george.tolio
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  OmniKit:
    path: OmniKit
targets:
  AllSet:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - AllSet.entitlements
    dependencies:
      - target: AllSetFinderNote
      - package: OmniKit
        product: OmniCore
      - package: OmniKit
        product: OmniPlatform
      - package: OmniKit
        product: FeatureDiagnostics
      - package: OmniKit
        product: FeatureClipboard
      - package: OmniKit
        product: FeatureDropRing
      - package: OmniKit
        product: FeatureDeskMinder
      - package: OmniKit
        product: FeatureIsland
      - package: OmniKit
        product: FeatureWindows
      - package: OmniKit
        product: FeatureSwitcher
      - package: OmniKit
        product: FeatureKeepAwake
      - package: OmniKit
        product: FeatureKeyboardClean
      - package: OmniKit
        product: FeatureSystemStats
      - package: OmniKit
        product: FeatureShortcutOverlay
      - package: OmniKit
        product: FeatureTextActions
      - package: OmniKit
        product: FeatureScreenshots
      - package: OmniKit
        product: FeatureStickyNotes
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: All Set
        NSHumanReadableCopyright: "© 2026 keburius. MIT License."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:
          - CFBundleURLName: com.george.tolio
            CFBundleURLSchemes: [tolio]
        NSMicrophoneUsageDescription: "All Set uses the microphone only while you record the screen with microphone audio turned on."
        NSRemindersFullAccessUsageDescription: "Desk Minder adds your reminders to Apple Reminders so they also alert on your iPhone and other devices."
        NSCalendarsFullAccessUsageDescription: "Notch Island shows your week's events and counts down to your next meeting."
        NSAppleEventsUsageDescription: "Notch Island reads what Music or Spotify is playing and controls playback, and its Dark Mode switch asks System Events to change the appearance."
        NSCameraUsageDescription: "Notch Island's mirror shows your camera so you can check how you look before a call. Nothing is recorded."
        NSDownloadsFolderUsageDescription: "Notch Island shows files that are still downloading, if you turn that on."
        NSBluetoothAlwaysUsageDescription: "Notch Island shows a short notice when AirPods or other Bluetooth devices connect."
        NSRemindersUsageDescription: "Desk Minder adds your reminders to Apple Reminders so they also alert on your iPhone and other devices."
    entitlements:
      path: App/AllSet.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_NAME: All Set
        PRODUCT_BUNDLE_IDENTIFIER: com.george.tolio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
  AllSetFinderNote:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/FinderNote
        excludes:
          - Info.plist
          - FinderNote.entitlements
    dependencies:
      - package: OmniKit
        product: OmniCore
    info:
      path: Extensions/FinderNote/Info.plist
      properties:
        CFBundleDisplayName: All Set
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FinderSync"
          NSExtensionAttributes: {}
    entitlements:
      path: Extensions/FinderNote/FinderNote.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: AllSetFinderNote
        PRODUCT_BUNDLE_IDENTIFIER: com.george.tolio.FinderNote
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
schemes:
  AllSet:
    build:
      targets:
        AllSet: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: OmniKit/OmniCoreTests
        - package: OmniKit/OmniPlatformTests
        - package: OmniKit/FeatureClipboardTests
        - package: OmniKit/FeatureDropRingTests
        - package: OmniKit/FeatureDeskMinderTests
        - package: OmniKit/FeatureIslandTests
        - package: OmniKit/FeatureWindowsTests
        - package: OmniKit/FeatureSwitcherTests
        - package: OmniKit/FeatureKeepAwakeTests
        - package: OmniKit/FeatureKeyboardCleanTests
        - package: OmniKit/FeatureSystemStatsTests
        - package: OmniKit/FeatureShortcutOverlayTests
        - package: OmniKit/FeatureTextActionsTests
        - package: OmniKit/FeatureScreenshotsTests
        - package: OmniKit/FeatureStickyNotesTests
    archive:
      config: Release
